<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Particle Life Lab</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="panel">
    <h1>Particle Life Lab</h1>
    <p class="hint">Emergent life from a random attraction matrix. Every reload/randomize is a new organism.</p>

    <label>
      Colors <span id="typesVal">5</span>
      <input type="range" id="types" min="2" max="8" step="1" value="5" />
    </label>

    <label>
      Particles <span id="countVal">900</span>
      <input type="range" id="count" min="100" max="3000" step="50" value="900" />
    </label>

    <label>
      Force strength <span id="forceVal">1.0</span>
      <input type="range" id="force" min="0.1" max="3" step="0.1" value="1.0" />
    </label>

    <label>
      Interaction radius <span id="radiusVal">80</span>
      <input type="range" id="radius" min="20" max="200" step="5" value="80" />
    </label>

    <label>
      Friction <span id="frictionVal">0.85</span>
      <input type="range" id="friction" min="0.5" max="0.99" step="0.01" value="0.85" />
    </label>

    <label class="checkbox">
      <input type="checkbox" id="trails" checked />
      Motion trails
    </label>

    <div class="buttons">
      <button id="randomizeMatrix">New organism</button>
      <button id="randomizePositions">Scatter</button>
      <button id="pause">Pause</button>
    </div>

    <div id="matrixWrap">
      <div class="hint">Attraction matrix (row attracts/repels column)</div>
      <div id="matrix"></div>
    </div>

    <div class="fps">FPS: <span id="fps">--</span></div>
  </div>

  <button id="toggleUI" title="Show/hide panel">☰</button>

  <script src="script.js"></script>
</body>
</html>
